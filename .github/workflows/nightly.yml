name: nightly

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            GOOS=linux GOARCH=$arch go build -trimpath -ldflags "-s -w" -o quiver-playtest ./cmd/quiver-playtest
            tar -czf "dist/quiver-playtest_nightly_linux_${arch}.tar.gz" quiver-playtest
          done
          (cd dist && sha256sum *.tar.gz > checksums.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/* \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly ${GITHUB_SHA::7}" \
            --notes "Automatic build of main at $GITHUB_SHA. Not a stable release."
